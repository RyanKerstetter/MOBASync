<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2D-MOBA</title>
  </head>
  <body>
    <main>
      <h1>2D-MOBA</h1>

      <section id="entry-panel" aria-label="Create or join a lobby">
        <p>
          <label for="username">Username</label>
          <input id="username" type="text" maxlength="24" value="Player" autocomplete="nickname" />
        </p>
        <p><button id="create-button" type="button">Create lobby</button></p>
        <form id="join-form">
          <label for="lobby-code">Lobby code</label>
          <input id="lobby-code" type="text" maxlength="6" autocomplete="off" />
          <button type="submit">Join</button>
        </form>
        <p id="message" role="status" aria-live="polite"></p>
      </section>

      <section id="lobby-panel" aria-label="Lobby" hidden>
        <header class="lobby-header">
          <p class="lobby-code">Lobby code <strong id="active-code"></strong> <button id="copy-button" type="button">Copy</button> <span id="copy-status" class="copy-status" role="status" aria-live="polite"></span></p>
          <button id="leave-button" type="button">Leave lobby</button>
        </header>

        <div class="lobby-grid">
          <section class="lobby-card" aria-label="Players">
            <h2>Players (<span id="player-count">0</span>)</h2>
            <ul id="player-list"></ul>
            <p id="game-activity" class="game-activity" role="status" aria-live="polite" hidden></p>

            <div class="lobby-group">
              <h3>You</h3>
              <form id="rename-form" class="field-row">
                <label for="lobby-username">Name</label>
                <input id="lobby-username" type="text" maxlength="24" autocomplete="nickname" />
                <button type="submit">Save</button>
              </form>
              <div class="field-row">
                <span id="team-label">Team</span>
                <div id="team-picker" class="team-picker" role="group" aria-labelledby="team-label"></div>
              </div>
            </div>
          </section>

          <section class="lobby-card" aria-label="Game settings">
            <h2>Game settings</h2>

            <div class="field">
              <label for="map-select">Map</label>
              <select id="map-select"></select>
              <p id="map-summary" class="mode-summary"></p>
            </div>

            <div class="field">
              <label for="mode-select">Game mode</label>
              <select id="mode-select"></select>
              <p id="mode-summary" class="mode-summary"></p>
            </div>

            <div class="lobby-group">
              <h3>Rules</h3>
              <div id="rules" class="rules">
                <label class="rule-row"><span>Respawn time (seconds)</span><input id="rule-respawn" type="number" /></label>
                <label id="rule-capture-row" class="rule-row" hidden><span>Seconds to capture the hill</span><input id="rule-capture" type="number" /></label>
                <div id="rule-limits"></div>
              </div>
            </div>
          </section>

          <section class="lobby-card chat-panel" aria-label="Lobby chat">
            <h2>Chat</h2>
            <ul id="chat-messages" aria-live="polite"></ul>
            <form id="chat-form">
              <label for="chat-input" class="visually-hidden">Message</label>
              <div class="chat-input-row">
                <input id="chat-input" type="text" maxlength="500" autocomplete="off" placeholder="Message the lobby" />
                <button type="submit">Send</button>
              </div>
            </form>
          </section>
        </div>

        <footer class="lobby-footer">
          <div class="lobby-status">
            <p id="mode-warning" class="mode-warning" role="status" aria-live="polite" hidden></p>
            <p id="last-result" class="last-result" hidden></p>
            <p id="lobby-message" role="status" aria-live="polite"></p>
          </div>
          <div class="lobby-actions">
            <button id="end-button" type="button" hidden>End game</button>
            <button id="start-button" type="button">Start game</button>
          </div>
        </footer>
      </section>

      <section id="select-panel" aria-label="Champion select" hidden>
        <div class="select-layout">
          <h2>Choose your champion</h2>
          <div class="select-body">
            <ul id="champion-grid" class="champion-grid"></ul>
            <aside id="champion-details" class="champion-details" aria-live="polite"></aside>
          </div>
          <ul id="select-players" class="select-players" aria-label="Players"></ul>
          <p id="select-message" role="status" aria-live="polite"></p>
          <div class="select-actions">
            <button id="select-back-button" type="button">Back to lobby</button>
            <button id="lock-button" type="button">Lock in</button>
          </div>
        </div>
      </section>

      <section id="game-panel" aria-label="Game" hidden>
        <div id="game-container" aria-label="Game arena" hidden></div>
        <section id="game-loading" aria-live="polite">
          <h3>Getting the game ready</h3>
          <p id="game-loading-progress">Connecting to the game server…</p>
          <p id="game-status" role="status" aria-live="polite">Connecting to game server…</p>
          <button id="return-button" type="button">Return to lobby</button>
        </section>
        <p id="game-toast" role="status" aria-live="polite" hidden></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
